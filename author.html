<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Profile | FavoRead</title>
    <link rel="stylesheet" href="style.css">
<body>
    <header>
        <nav>
            <div class="menu">
              <a href="logIn.html">Log in</a>
              <a href="signIn.html">Sign in</a>
              <a href="index.html">Начало</a>
              <a href="author.html">Author</a>
              <a href="reader.html">Reader</a>
              </div>
        </nav>
    </header>

    <main class="profile-container">
        <section class="profile-header">
            <div class="profile-info">
                <img src="" alt="Author" class="author-img">
                <div class="author-details">
                    <h1>J.K. Rowling</h1>
                    <p class="email">jkrowlingbooks@gmail.com</p>
                </div>
            </div>
            
            <div class="profile-actions">
                <div class="action-buttons">
                    <button class="btn-add">Add book<i class="fa-regular fa-pen-to-square"></i></button>
                     <button class="btn-add">Add bio<i class="fa-regular fa-pen-to-square"></i></button>
                </div>
                <div class="stats-card">
                    <div class="stat-item">
                        <strong>10</strong>
                        <span>BOOKS</span>
                    </div>
                    <div class="divider"></div>
                    <div class="stat-item">
                        <strong>10</strong>
                        <span>REVIEWS</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="bio-section">
            <p>"J.K. Rowling grew up in England and developed a passion for writing..."</p>
            <p>"She is a Fantasy author and novelist. Her work has appeared in global publications..."</p>
        </section>

        <section class="books-grid">
            <div class="book-item">
                <img src="hp1.jpg" alt="Book Cover">
                <p>Harry Potter and the Sorcerer's Stone</p>
            </div>
        </section>
    </main>
</body>
</html>
