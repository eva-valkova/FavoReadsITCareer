        <h1>Sign In</h1>
        <p>Please enter your details</p>

    <form id="signInForm" class="form-box">
        <div class="input-group">
            <input type="text" id="firstName" class="input-field" placeholder="" required>
            <label for="firstName" class="floating-label">First name</label>
        </div>
        <div class="input-group">
            <input type="text" id="lastName" class="input-field" placeholder="" required>
            <label for="lastName" class="floating-label">Last name</label>
        </div>
        <div class="input-group">
            <input type="number" id="age" class="input-field" placeholder="" required>
            <label for="age" class="floating-label">Age</label>
        </div>
        <div class="input-group">
            <input type="email" id="email" class="input-field" placeholder="" required>
            <label for="email" class="floating-label">Email address</label>
        </div>
        <div class="input-group">
            <input type="password" id="password" class="input-field" placeholder="" required>
            <label for="password" class="floating-label">Password</label>
            <div class="eye-icon">
            </div>
        </div>
        <div class="radio_container">
            <p>Choose a profile:</p>
            <input type="radio" id="reader" name="role" value="Reader">
            <label for="reader">Reader</label>
    
            <input type="radio" id="author" name="role" value="Author">
            <label for="author">Author</label>
        </div>

    <script>
    document.getElementById('signInForm').addEventListener('submit', async (e) => {
    e.preventDefault(); // Това СПИРА презареждането
    console.log("Опит за регистрация...");

    const selectedRole = document.querySelector('input[name="role"]:checked').value;

    // Обектът трябва да съвпада с твоя RegisterDto в C#
    const registerDto = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: selectedRole
        // Ако в RegisterDto имаш firstName/lastName, добави ги и тук
    };

    try {
        const response = await fetch('https://localhost:7284/Account/Register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(registerDto)
        });

        if (response.ok) {
            alert("User created successfully!");
            window.location.href = 'logIn.html';
        } else {
            const errors = await response.json();
            console.error("Registration errors:", errors);
            // Identity често връща масив от грешки (напр. твърде слаба парола)
            alert("Error " + (errors[0]?.description || "Check data"));
        }
    } catch (error) {
        console.error("Error in connection: ", error);
    }
});
    </script>
